name: CI

on:
  push:
    branches: [main, production-hardening, render-demo-ready]
  pull_request:
    branches: [main, production-hardening, render-demo-ready]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check --config pyproject.toml app tests

      - name: Run Pytest Suite
        run: |
          pytest tests -v

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Next.js 15
        env:
          NEXT_PUBLIC_API_URL: https://dummy-ci-api.onrender.com
        run: npm run build

  docker-build:
    name: Docker Build & 512MB Memory Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t finance-flow-backend backend/

      - name: Verify Execution within Render 512MB RAM Limit
        run: |
          docker run --memory="512m" --memory-swap="512m" --rm finance-flow-backend python -c "from app.ocr import init_ocr, image_to_text; init_ocr(); print('RapidOCR initialized successfully within Render 512MB cgroup limit!')"
