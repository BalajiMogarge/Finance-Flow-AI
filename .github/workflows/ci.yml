name: CI

on:
  push:
    branches: [main, production-hardening, render-demo-ready, feature/demo-ui-redesign, feature/render-verification-and-limits]
  pull_request:
    branches: [main, production-hardening, render-demo-ready, feature/render-verification-and-limits]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check --config pyproject.toml app tests

      - name: Run Pytest Suite
        run: |
          pytest tests -v

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Next.js 15
        env:
          NEXT_PUBLIC_API_URL: https://dummy-ci-api.onrender.com
        run: npm run build

  docker-build:
    name: Docker Build & 512MB Memory Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t finance-flow-backend backend/

      - name: Verify Execution within Render 512MB RAM Limit
        run: |
          # 1. Launch real backend container strictly limited to 512MB RAM and swap
          docker run -d --name live-backend \
            --memory="512m" --memory-swap="512m" \
            -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e STORAGE_BACKEND=local \
            finance-flow-backend

          # 2. Install client dependency for running end-to-end API verification
          python -m pip install --upgrade pip
          pip install requests

          # 3. Run realistic API end-to-end verification against the live container
          TARGET_URL="http://127.0.0.1:8000" python scripts/ci_docker_memory_test.py

          # 4. Check whether container was killed by Docker OOM killer
          OOM_STATUS=$(docker inspect live-backend --format '{{.State.OOMKilled}}')
          echo "Container OOMKilled flag: $OOM_STATUS"
          if [ "$OOM_STATUS" = "true" ]; then
            echo "ERROR: Container was killed by Docker OOM killer!"
            docker logs live-backend
            exit 1
          fi

          # 5. Extract Linux cgroup peak memory usage
          PEAK_BYTES=$(docker exec live-backend sh -c '
            if [ -f /sys/fs/cgroup/memory.peak ]; then
              cat /sys/fs/cgroup/memory.peak
            elif [ -f /sys/fs/cgroup/memory/memory.max_usage_in_bytes ]; then
              cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes
            else
              cat /sys/fs/cgroup/memory.current 2>/dev/null || echo 0
            fi
          ')

          if [ -n "$PEAK_BYTES" ] && [ "$PEAK_BYTES" -gt 0 ] 2>/dev/null; then
            PEAK_MB=$(awk "BEGIN {printf \"%.2f\", $PEAK_BYTES / 1024 / 1024}")
            HEADROOM_MB=$(awk "BEGIN {printf \"%.2f\", 512 - $PEAK_MB}")
            PERCENT=$(awk "BEGIN {printf \"%.1f\", ($HEADROOM_MB / 512) * 100}")
            echo "=========================================================="
            echo "REAL DOCKER 512MB PEAK MEMORY VALIDATION:"
            echo "Container Peak RSS:     $PEAK_MB MB"
            echo "Render 512MB Headroom:  $HEADROOM_MB MB ($PERCENT% free)"
            echo "=========================================================="
          fi

          # 6. Stop and remove container
          docker stop live-backend
          docker rm live-backend
